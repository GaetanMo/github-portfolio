<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            padding: 50px 20px;
        }

        h1 {
            font-size: 3rem;
        }

        p {
            font-size: 1.2rem;
            color: #cbd5e1;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #38bdf8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        section {
            padding: 40px 20px;
        }

        .project {
            background: #1e293b;
            margin: 15px auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }

        footer {
            padding: 20px;
            background: #020617;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bonjour</h1>
        <p>Étudiant passionné</p>
        <a href="https://github.com" class="btn">Voir mon GitHub</a>
    </header>

    <section>
        <h2>Mes Projets</h2>

        <div class="project">
            <h3>Projet 1</h3>
            <p>Projet.</p>
        </div>

        <div class="project">
            <h3>Projet 2</h3>
            <p>Projet.</p>

    </section>

    <footer>
        <p>© 2026 </p>
    </footer>

</html>
