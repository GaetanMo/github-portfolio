    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([finalBytes], { type: entry.mime }),
                );
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([], { type: entry.mime }),
                );
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids)
            template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

 #111720;\n    --border: rgba(255,255,255,0.06);\n    --text: #e8edf3;\n    --muted: #6b7a8d;\n    --accent: oklch(75% 0.22 195);\n    --accent2: oklch(70% 0.22 270);\n    --font: 'Space Grotesk', sans-serif;\n    --mono: 'Space Mono', monospace;\n  }\n\n  html { scroll-behavior: smooth; }\n\n  body {\n    background: var(--bg);\n    color: var(--text);\n    font-family: var(--font);\n    font-size: 16px;\n    line-height: 1.6;\n    overflow-x: hidden;\n  }\n\n  /* ── NAV ── */\n  nav {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    z-index: 100;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 0 48px;\n    height: 64px;\n    background: rgba(8,12,16,0.85);\n    backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    transition: background 0.3s;\n  }\n\n  .nav-logo {\n    font-family: var(--mono);\n    font-size: 14px;\n    color: var(--accent);\n    text-decoration: none;\n    letter-spacing: 0.05em;\n  }\n\n  .nav-links {\n    display: flex;\n    gap: 36px;\n    list-style: none;\n  }\n\n  .nav-links a {\n    text-decoration: none;\n    color: var(--muted);\n    font-size: 14px;\n    font-weight: 500;\n    letter-spacing: 0.03em;\n    transition: color 0.2s;\n  }\n\n  .nav-links a:hover { color: var(--text); }\n\n  /* ── HERO ── */\n  #hero {\n    position: relative;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    text-align: center;\n    overflow: hidden;\n  }\n\n  #hero-canvas {\n    position: absolute;\n    inset: 0;\n    opacity: 0.18;\n    pointer-events: none;\n  }\n\n  .hero-content {\n    position: relative;\n    z-index: 2;\n    max-width: 800px;\n    padding: 0 24px;\n  }\n\n  .hero-role {\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--accent);\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    margin-bottom: 20px;\n    opacity: 0;\n    animation: fadeUp 0.7s 0.2s forwards;\n  }\n\n  .hero-name {\n    font-size: clamp(40px, 7vw, 72px);\n    font-weight: 700;\n    line-height: 1.0;\n    letter-spacing: -0.03em;\n    margin-bottom: 24px;\n    opacity: 0;\n    animation: fadeUp 0.8s 0.4s forwards;\n  }\n\n  .hero-name .accent { color: var(--accent); }\n  .hero-name .accent2 { color: var(--accent2); }\n\n  .hero-tagline {\n    font-size: 18px;\n    color: var(--muted);\n    max-width: 520px;\n    margin: 0 auto 40px;\n    font-weight: 400;\n    opacity: 0;\n    animation: fadeUp 0.8s 0.6s forwards;\n  }\n\n  .hero-actions {\n    display: flex;\n    gap: 16px;\n    justify-content: center;\n    align-items: center;\n    opacity: 0;\n    animation: fadeUp 0.8s 0.8s forwards;\n  }\n\n  .btn-primary {\n    padding: 12px 28px;\n    background: var(--accent);\n    color: #060a0d;\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 600;\n    border: none;\n    cursor: pointer;\n    text-decoration: none;\n    transition: opacity 0.2s, transform 0.2s;\n    letter-spacing: 0.02em;\n  }\n\n  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }\n\n  .btn-ghost {\n    padding: 12px 28px;\n    background: transparent;\n    color: var(--text);\n    font-family: var(--font);\n    font-size: 14px;\n    font-weight: 500;\n    border: 1px solid var(--border);\n    cursor: pointer;\n    text-decoration: none;\n    transition: border-color 0.2s, color 0.2s, transform 0.2s;\n  }\n\n  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }\n\n  .hero-github {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    color: var(--muted);\n    text-decoration: none;\n    font-size: 14px;\n    transition: color 0.2s;\n  }\n\n  .hero-github:hover { color: var(--text); }\n\n  .scroll-hint {\n    position: absolute;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 8px;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.1em;\n    color: var(--muted);\n    opacity: 0;\n    animation: fadeUp 1s 1.2s forwards;\n  }\n\n  .scroll-arrow {\n    width: 1px;\n    height: 40px;\n    background: linear-gradient(to bottom, var(--accent), transparent);\n    animation: scrollPulse 2s ease-in-out infinite;\n  }\n\n  /* ── SECTIONS ── */\n  section {\n    padding: 100px 0;\n  }\n\n  .container {\n    max-width: 1100px;\n    margin: 0 auto;\n    padding: 0 48px;\n  }\n\n  .section-label {\n    font-family: var(--mono);\n    font-size: 20px;\n    color: var(--accent);\n    letter-spacing: 0.15em;\n    text-transform: uppercase;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n\n  .section-label::before {\n    content: '//';\n    opacity: 0.5;\n  }\n\n  .section-title {\n    font-size: clamp(32px, 5vw, 52px);\n    font-weight: 700;\n    letter-spacing: -0.02em;\n    margin-bottom: 16px;\n    line-height: 1.1;\n  }\n\n  .section-sub {\n    color: var(--muted);\n    font-size: 16px;\n    max-width: 500px;\n    margin-bottom: 64px;\n  }\n\n  /* ── ABOUT ── */\n  #about {\n    background: var(--bg2);\n    border-top: 1px solid var(--border);\n    border-bottom: 1px solid var(--border);\n  }\n\n  .about-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 80px;\n    align-items: center;\n  }\n\n  .about-image {\n    aspect-ratio: 4/3;\n    background: var(--surface);\n    border: 1px solid var(--border);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    overflow: hidden;\n    position: relative;\n  }\n\n  .about-image-inner {\n    width: 100%;\n    height: 100%;\n    background: \n      repeating-linear-gradient(\n        0deg,\n        transparent,\n        transparent 30px,\n        rgba(255,255,255,0.025) 30px,\n        rgba(255,255,255,0.025) 31px\n      ),\n      repeating-linear-gradient(\n        90deg,\n U', 'y=ŷ', '∈ ℝⁿ',\n  'import torch', 'P(y|x)', '∞', 'KL(p||q)',\n  'O(n²)', '∀x', '∃', '≈', '→', '⟨v,w⟩'\n];\n\nlet particles = [];\n\nfunction resize() {\n  canvas.width = window.innerWidth;\n  canvas.height = window.innerHeight;\n}\n\nfunction initParticles() {\n  particles = [];\n  const count = Math.floor((canvas.width * canvas.height) / 22000);\n  for (let i = 0; i < count; i++) {\n    particles.push({\n      x: Math.random() * canvas.width,\n      y: Math.random() * canvas.height,\n      text: symbols[Math.floor(Math.random() * symbols.length)],\n      size: Math.random() * 5 + 9,\n      speed: Math.random() * 0.25 + 0.05,\n      drift: (Math.random() - 0.5) * 0.15,\n      opacity: Math.random() * 0.5 + 0.15,\n    });\n  }\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  ctx.font = `400 14px 'Space Mono', monospace`;\n\n  particles.forEach(p => {\n    ctx.globalAlpha = p.opacity;\n    ctx.fillStyle = '#7dd3fc';\n    ctx.font = `${p.size}px 'Space Mono', monospace`;\n    ctx.fillText(p.text, p.x, p.y);\n\n    p.y -= p.speed;\n    p.x += p.drift;\n\n    if (p.y < -30) {\n      p.y = canvas.height + 10;\n      p.x = Math.random() * canvas.width;\n    }\n    if (p.x < -100) p.x = canvas.width + 10;\n    if (p.x > canvas.width + 100) p.x = -10;\n  });\n\n  ctx.globalAlpha = 1;\n  requestAnimationFrame(draw);\n}\n\nresize();\ninitParticles();\ndraw();\nwindow.addEventListener('resize', () => { resize(); initParticles(); });\n\n// ── SCROLL REVEAL ──\nconst reveals = document.querySelectorAll('.reveal');\nconst observer = new IntersectionObserver((entries) => {\n  entries.forEach((e, i) => {\n    if (e.isIntersecting) {\n      setTimeout(() => e.target.classList.add('visible'), i * 80);\n    }\n  });\n}, { threshold: 0.12 });\n\nreveals.forEach(el => observer.observe(el));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
